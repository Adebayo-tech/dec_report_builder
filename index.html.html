function snap(get,col){return function(next,err){let on=1,t,last,first=1;const run=()=>get().then(r=>{if(!on)return;const g=JSON.stringify(r.docs?r.docs.map(d=>[d.id,d.data()]):[r.exists,r.data()]);if(g===last)return;last=g;next(r)}).catch(e=>err&&err(e));run();const cfg={event:'*',schema:'public',table:'docs'};if(col)cfg.filter='col=eq.'+col;

function ref(p){const[col,id]=p.split('/'),r={async get(){const{data,error}=await sb.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();if(error)throw error;return{id,exists:!!data,data:()=>data&&data.data}},async set(o){const{error}=await sb.from('docs').upsert({col,id,data:o,updated_at:new Date().toISOString()});if(error)throw error},async update(o){const s=await r.get();return r.set({...(s.data()||{}),...o})},async delete(){const{error}=await sb.from('docs').delete().eq('col',col).eq('id',id);if(error)throw error}};r.onSnapshot=snap(()=>r.get(),col);return r}

function login(msg){return new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99';o.innerHTML='<form class="box" style="width:320px"><b>Sign in</b><p class="mu" id="lm"></p><p><input name="e" type="email" placeholder="Email" style="width:100%;box-sizing:border-box" required autocomplete="username"></p><p><input name="p" type="password" placeholder="Password" style="width:100%;box-sizing:border-box" required autocomplete="current-password"></p><button class="b" style="width:100%">Sign in</button><p class="mu" style="margin-top:10px;font-size:11px">Forgot password? Ask your administrator to reset it from the Supabase dashboard.</p></form>';document.body.append(o);Q('#lm').textContent=msg||'Staff accounts only. Use the credentials your administrator gave you.';o.firstChild.onsubmit=async ev=>{ev.preventDefault();const f=ev.target,{error}=await sb.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});if(error){Q('#lm').textContent=error.message;return}o.remove();res()}})}

<script>
const T=['First Term','Second Term','Third Term'];
const TR=['Relationship with Peers','Neatness','Honesty','Punctuality','Respect','Handwriting','Games and Sport','Clubs'];
const core=['Mathematics','English Studies','Civic Education'];
const DEF={name:'DEC INTERNATIONAL SCHOOL',address:'Avenue Street, Kano, Nigeria',motto:'Education is the key to success',principal:'',pfx:'DEC',ses:'2025-2026',t:0,days:60,resume:'',fees:'',ca:40,ex:60,passMark:40,
types:['Day','Boarding'],
bands:[{m:70,g:'A',r:'Excellent'},{m:60,g:'B',r:'Very Good'},{m:50,g:'C',r:'Good'},{m:40,g:'D',r:'Pass'},{m:0,g:'F',r:'Fail'}],
classes:['Creche','Pre Nursery 1','Pre Nursery 2','Nursery 1','Nursery 2','Basic 1','Basic 2','Basic 3','Basic 4','Basic 5'].map(n=>({n,s:n=='Creche'?['Mathematics','English Studies','Rhymes','Social Studies']:core}))};
let C=DEF,ST=[],SC={},db,user,admin=false,view='scores',sel={c:'',r:'ALL'},u2,key,promo={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pid=()=>C.ses+'_'+C.t,sesL=s=>s.replace('-','/'),cd=n=>C.classes.find(x=>x.n==n)||C.classes[0];
const allowedClasses=()=>{const all=C.classes.map(x=>x.n);if(admin)return all;return all.filter(n=>MYCLASSES.includes(n))};
const curC=()=>{const a=allowedClasses();if(!a.length)return '';if(sel.c&&a.includes(sel.c))return sel.c;return a[0]};
const gr=v=>C.bands.find(b=>v>=b.m)||C.bands[C.bands.length-1],ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10<4)?n%10:0]);
const act=c=>ST.filter(s=>s.on!==false&&s.cls==c);
const NB={g:'—',r:''},bl=v=>v===undefined||v===null||v==='';
function calc(d,subs){const rows=subs.map(s=>{const[a,e]=(d&&d.sc&&d.sc[s])||[];const ca=+a||0,ex=+e||0,t=ca+ex,em=bl(a)&&bl(e);return{s,ca,ex,t,b:em?NB:gr(t),e:em}});const tot=rows.reduce((x,r)=>x+r.t,0),avg=subs.length?tot/subs.length:0,has=rows.some(r=>!r.e);return{rows,tot,avg,has,b:has?gr(avg):NB}}
function pos(reg,c){const subs=cd(c).s,all=act(c).map(s=>calc(SC[s.reg],subs)).filter(k=>k.has).map(k=>k.tot),k0=calc(SC[reg],subs);return{p:k0.has?1+all.filter(x=>x>k0.tot).length:0,n:all.length}}
const ordp=p=>p.p?ord(p.p):'—';

/* Cumulative Average & Auto-Promotion logic */
const lvOf=x=>x.lv||x.n,levels=()=>[...new Set(C.classes.map(lvOf))];let ptt={};
function nextOf(n){const cl=C.classes.find(x=>x.n==n);if(!cl)return'Graduated';const L=levels(),i=L.indexOf(lvOf(cl));if(i<0||i+1>=L.length)return'Graduated';const cands=C.classes.filter(y=>lvOf(y)==L[i+1]),same=cl.arm&&cands.find(y=>cl.arm==y.arm);return(same||cands[0]).n}
function getCumData(student) {
  let sumAvg = 0, count = 0;
  for(let j=0; j<C.t; j++) {
    const d = PV[j] ? PV[j][student.reg] : null;
    if(d) {
      const k = calc(d, d.subs || cd(d.cls).s);
      if(k.has) { sumAvg += k.avg; count++; }
    }
  }
  const dCur = SC[student.reg];
  if(dCur) {
    const kCur = calc(dCur, cd(dCur.cls).s);
    if(kCur.has) { sumAvg += kCur.avg; count++; }
  }
  const cumAvg = count > 0 ? sumAvg / count : 0;
  let targetCls = nextOf(student.cls);
  let autoTarget = targetCls;
  if (cumAvg < C.passMark) { autoTarget = student.cls; }
  return { cumAvg, autoTarget };
}

const PEND={},INF={},_saveT={},_busy={},TF=['sc','pres','dom'];
function applyPend(reg,d){[...(INF[reg]||[]),...(PEND[reg]||[])].forEach(f=>f(d));return d}
function setSaveState(s){const el=document.getElementById('sstat');if(!el)return;
  if(s=='pending'){el.textContent='● saving…';el.style.color='#d98b00'}
  else if(s=='saved'){el.textContent='● saved';el.style.color='#2e8b57';setTimeout(()=>{if(el.textContent=='● saved')el.textContent=''},2000)}
  else{el.textContent='● NOT saved';el.style.color='#c0392b'}}
function save(reg,fn,kind){
  const s=ST.find(x=>x.reg==reg);if(!s)return;
  if(!admin){
    if(!MYCLASSES.includes(s.cls)){alert('You are not assigned to this class. Contact the administrator.');return}
    if(!TF.includes(kind)){alert('Teachers can only edit scores, attendance and domain ratings.');return}
  }
  const k=pid();(PEND[reg]=PEND[reg]||[]).push(fn);
  const d={...(SC[reg]||{p:k,reg,sc:{},dom:{}})};fn(d);d.cls=s.cls;d.subs=cd(s.cls).s;SC[reg]=d;
  setSaveState('pending');clearTimeout(_saveT[reg]);_saveT[reg]=setTimeout(()=>flush(reg,k),400)}
async function flush(reg,k){
  if(_busy[reg]){_saveT[reg]=setTimeout(()=>flush(reg,k),250);return}
  const fns=PEND[reg]||[];if(!fns.length)return;
  PEND[reg]=[];INF[reg]=fns;_busy[reg]=1;
  const s=ST.find(x=>x.reg==reg),path='scores/'+k+'_'+reg;
  try{
    const g=await db.doc(path).get(),d=g.exists?{...g.data()}:{p:k,reg,sc:{},dom:{}};
    fns.forEach(f=>f(d));d.p=k;d.reg=reg;if(s){d.cls=s.cls;d.subs=cd(s.cls).s}
    await db.doc(path).set(d);
    INF[reg]=null;if(k==pid())SC[reg]=applyPend(reg,{...d});
    setSaveState((PEND[reg]||[]).length?'pending':'saved')
  }catch(e){
    PEND[reg]=fns.concat(PEND[reg]||[]);INF[reg]=null;setSaveState('error');
    alert('Could not save: '+(e.message||e)+'\nYour entry is still on screen and will be retried with your next edit.')
  }finally{_busy[reg]=0}}
function sub(){const k=pid();if(!db||k==key)return;key=k;SC={};u2&&u2();UP.forEach(f=>f());UP=[];PV={};for(let j=0;j<C.t;j++)UP.push(db.collection('scores').where('p','==',C.ses+'_'+j).onSnapshot(q=>{PV[j]={};q.docs.forEach(d=>PV[j][d.data().reg]=d.data());draw(1)}));u2=db.collection('scores').where('p','==',k).onSnapshot(q=>{SC={};q.docs.forEach(d=>SC[d.data().reg]=d.data());Object.keys(PEND).forEach(r=>{if((PEND[r]||[]).length||(INF[r]||[]).length)SC[r]=applyPend(r,{...(SC[r]||{p:pid(),reg:r,sc:{},dom:{}})})});draw(1)})}
function nav(){
  const t=[['scores','Score Entry'],['reports','Report Cards'],['board','Broadsheet'],['info','Class Info']];
  if(admin)t.push(['students','Students'],['past','Past Students'],['import','Import Data'],['admin','Settings & Promotion']);

}
let late=0;
function draw(soft){
  const ae=document.activeElement;if(soft&&ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.closest('#m')){late=1;return}late=0;
  nav();
  $('#sn').innerHTML=(C.logo?`<img src="${C.logo}" style="height:26px;vertical-align:middle;margin-right:8px;background:#fff;border-radius:4px">`:'')+esc(C.name);
  $('#ps').textContent=sesL(C.ses)+' · '+T[C.t];
  $('#rl').textContent=admin?'Administrator':('Teacher'+(MYCLASSES.length?' ('+MYCLASSES.join(', ')+')':''));

    $('#m').innerHTML='<div class="warn"><b>No classes assigned.</b><br>You are signed in as a teacher but have not been assigned to any class. Please contact the administrator. If your class was recently renamed, the administrator also needs to update your assignment.</div>';
    return;
  }

    ({info:vInfo,scores:vScores,reports:vReports,board:vBoard,students:vStudents,past:vPast,import:vImport,admin:vAdmin}[view]||vScores)();
  if(view=='reports')fitCards($('#m'))
}
const clsSel=()=>{
  const a=allowedClasses();
  if(!a.length)return '<span class="warn" style="margin:0">No class assigned.</span>';
  return `<label>Class<select data-sel="c">${a.map(n=>`<option ${n==curC()?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`;
}
function vScores(){
  const c=curC(),subs=cd(c).s,L=act(c);
  let h=`<div class="box"><div class="row">${clsSel()}<span class="mu">CA max ${C.ca} · Exam max ${C.ex} · scores save automatically. Press Enter / arrows to move down a column.</span><button class="b" data-act="csv">Export CSV</button></div><div class="sc"><table><tr><th rowspan=2>Reg No.</th><th rowspan=2>Name</th>${subs.map(s=>`<th class="c" colspan=2>${esc(s)}</th>`).join('')}<th rowspan=2 class="c">Total</th><th rowspan=2 class="c">Avg</th><th rowspan=2 class="c">Grade</th><th rowspan=2 class="c">Pos.</th></tr><tr>${subs.map(()=>`<th class="c">CA</th><th class="c">Exam</th>`).join('')}</tr>`;
  for(const s of L){const d=SC[s.reg],k=calc(d,subs),p=pos(s.reg,c);h+=`<tr data-r="${esc(s.reg)}"><td>${esc(s.reg)}</td><td>${esc(s.name)}</td>${subs.map(j=>{const v=(d&&d.sc&&d.sc[j])||[];return[0,1].map(i=>`<td class="c"><input type="number" min="0" step="0.5" max="${i?C.ex:C.ca}" data-sc="${esc(j)}" data-k="${i}" value="${v[i]??''}"></td>`).join('')}).join('')}<td class="c tot">${k.tot}</td><td class="c avg">${k.avg.toFixed(1)}</td><td class="c gd">${k.b.g}</td><td class="c ps">${ordp(p)}</td></tr>`}
  return h+`</table></div>${L.length?'':'<p class="mu">No students in this class yet.</p>'}</div>`

function fitCards(root){
  (root||document).querySelectorAll('.rc').forEach(c=>{
    const ow=c.style.width,om=c.style.maxWidth;c.style.width='780px';c.style.maxWidth='none';c.style.zoom='';
    const target=Math.floor(780*297/210)-10;
    setDensity(c,0);
    if(c.offsetHeight>target){
      let lo=0,hi=1;setDensity(c,1);
      if(c.offsetHeight<=target){for(let i=0;i<9;i++){const m=(lo+hi)/2;setDensity(c,m);if(c.offsetHeight<=target)hi=m;else lo=m}setDensity(c,hi)}

    c.style.width=ow;c.style.maxWidth=om;
  })
}

/* STRICT 1-PAGE PDF GENERATION */
async function pdf(){
  const cs=[...document.querySelectorAll('#m .rc')],st=$('#pst');if(!cs.length)return;
  try{
    if(!window.jspdf||!window.html2canvas)throw new Error('PDF tools did not load, reload the page');
    fitCards($('#m'));const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    
    for(let i=0;i<cs.length;i++){
      st.textContent='Building page '+(i+1)+' of '+cs.length+'…';
      
      // Render at scale 4 for crisp text, use PNG to prevent blurriness
      const cv=await html2canvas(cs[i],{scale:4,backgroundColor:'#fff'}); 
      const imgData = cv.toDataURL('image/png'); 
      
      if(i) doc.addPage();
      
      // Math: A4 is 210x297. Margins are 10mm. Max area is 190x277.
      let w=190, h=cv.height*(190/cv.width);
      if(h > 277) {
        // Force it to fit exactly within the page height
        h = 277;
        w = cv.width*(277/cv.height);
      }
      
      // Center the image perfectly
      const x = (210 - w) / 2;
      const y = 10;
      
      doc.addImage(imgData, 'PNG', x, y, w, h);
    }
    
    const blob=doc.output('blob');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${curC()}_${sel.r=='ALL'?'All':sel.r}_${pid()}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);st.textContent='PDF ready.'
  }catch(e){st.textContent='PDF failed: '+(e.message||e)}
}

function rmkBox(one,d){const R=remarks(one,calc(d,cd(one.cls).s),d,pos(one.reg,one.cls));return`<label class="mu">Class teacher's remark (auto-written; type to override)<textarea placeholder="${esc(R.t)}" data-f="tr" data-r="${esc(one.reg)}">${esc(d.tr||'')}</textarea></label><label class="mu">Headmaster's remark (auto-written; type to override)<textarea placeholder="${esc(R.p)}" data-f="pr" data-r="${esc(one.reg)}">${esc(d.pr||'')}</textarea></label>`}
$('#m').addEventListener('change',e=>{const t=e.target;if(t.id!='sg'||!db||!admin||!t.files[0])return;const im=new Image();im.onload=async()=>{const k=Math.min(1,400/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k)||1;cv.height=Math.round(im.height*k)||1;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const o={...C,sig:cv.toDataURL('image/png')};try{await db.doc('cfg/school').set(o);C=o;draw()}catch(x){alert('Signature could not be saved: '+(x.message||x))}};im.onerror=()=>alert('Could not read that image.');im.src=URL.createObjectURL(t.files[0])});

function cum(s,k){if(!C.t)return'';let sum=k.tot,av=k.avg,n=1;const row=(a,b,c,e)=>`<tr><td>${a}</td><td>${b}</td><td>${c}</td><td>${e}</td></tr>`,R=[];for(let j=0;j<C.t;j++){const d=(PV[j]||{})[s.reg],x=d?calc(d,d.subs||Object.keys(d.sc||{})):null;R.push(row(T[j],x?x.tot:'—',x?x.avg.toFixed(1):'—',x?x.b.g:'—'));if(x){sum+=x.tot;av+=x.avg;n++}}R.push(row(T[C.t]+' (this term)',k.tot,k.avg.toFixed(1),k.b.g));if(C.t==2)R.push(row('Cumulative ('+n+' terms)',sum,(av/n).toFixed(1),gr(av/n).g));return`<div class="bar" style="margin-top:var(--tm2,10px)">TERMLY RECORD</div><table class="cm"><tr><th>Term</th><th>Total Score</th><th>Average</th><th>Grade</th></tr>${R.join('')}</table>`}
function bprint(){let st=document.getElementById('pg');if(!st){st=document.createElement('style');st.id='pg';document.head.append(st)}st.textContent='@media print{@page{size:A4 landscape;margin:10mm}}';const off=()=>{st.textContent='';window.removeEventListener('afterprint',off)};window.addEventListener('afterprint',off);try{window.print()}catch(x){}}
function bxl(){if(!window.XLSX)return alert('The spreadsheet library did not load. Reload the page.');const c=curC(),subs=cd(c).s,L=act(c).map(s=>({s,k:calc(SC[s.reg],subs)})).sort((a,b)=>b.k.tot-a.k.tot),rows=[['Pos.','Reg No.','Name',...subs,'Total','Average','Grade']];L.forEach(x=>rows.push([pos(x.s.reg,c).p||'',x.s.reg,x.s.name,...x.k.rows.map(r=>r.e?'':r.t),x.k.has?x.k.tot:'',x.k.has?+x.k.avg.toFixed(1):'',x.k.b.g]));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),c.replace(/[\\\/?*\[\]:]/g,'').slice(0,31)||'Class');const b=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='Broadsheet_'+c+'_'+pid()+'.xlsx';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),5000)}
