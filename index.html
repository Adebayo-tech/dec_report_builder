<style>
/* ===== MODERN SHARP UI ===== */
:root {
  --bg: #f1f5f9; 
  --fg: #0f172a; 
  --cd: #ffffff; 
  --mu: #64748b; 
  --ac: #4f46e5; 
  --ac-hover: #4338ca;
  --bd: #e2e8f0;

  --sh-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  --sh-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]) {
    --bg: #0f172a; 
    --fg: #f8fafc; 
    --cd: #1e293b; 
    --mu: #94a3b8; 
    --ac: #6366f1; 
    --ac-hover: #818cf8;
    --bd: #334155; 
    --sh: 0 1px 3px rgba(0,0,0,0.3);
    --sh-md: 0 4px 6px -1px rgba(0,0,0,0.4);
    --sh-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
  }
}
:root[data-theme=dark] {
  --bg: #0f172a; --fg: #f8fafc; --cd: #1e293b; --mu: #94a3b8; --ac: #6366f1; 
  --ac-hover: #818cf8; --bd: #334155; --sh: 0 1px 3px rgba(0,0,0,0.3); 
  --sh-md: 0 4px 6px -1px rgba(0,0,0,0.4); --sh-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top,0px); }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); }

header { background: var(--cd); color: var(--fg); padding: 14px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--bd); box-shadow: var(--sh); position: relative; z-index: 20; }
header b { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
header span { color: var(--mu); font-size: 13px; font-weight: 500; }
header a { color: var(--ac); text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 12px; border-radius: 6px; transition: background 0.2s; }
header a:hover { background: rgba(79,70,229,0.1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) header a:hover { background: rgba(99,102,241,0.15); } }

nav { display: flex; gap: 6px; padding: 12px 20px; flex-wrap: wrap; background: var(--bg); border-bottom: 1px solid var(--bd); position: sticky; top: 0; z-index: 10; }
nav button { border: 1px solid transparent; background: transparent; color: var(--mu); padding: 8px 16px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600; transition: all 0.2s; }
nav button:hover { background: var(--cd); color: var(--fg); box-shadow: var(--sh); }
nav button.on { background: var(--ac); color: #fff; box-shadow: var(--sh-md); border-color: var(--ac); }

main { padding: 24px 20px; max-width: 1200px; margin: auto; }
.box { background: var(--cd); border: 1px solid var(--bd); border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: var(--sh); }
.box > b:first-child { font-size: 15px; font-weight: 700; color: var(--fg); margin-bottom: 12px; display: inline-block; }

.sc { overflow-x: auto; border-radius: 8px; border: 1px solid var(--bd); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--bd); padding: 10px 12px; text-align: left; }
th { background: var(--bg); color: var(--fg); font-weight: 600; white-space: nowrap; border-top: none; }
td { background: var(--cd); color: var(--fg); }
tr:last-child td { border-bottom: none; }
td.c, th.c { text-align: center; }

input, select, textarea, button { font: inherit; color: var(--fg); background: var(--cd); border: 1px solid var(--bd); border-radius: 8px; padding: 8px 12px; transition: all 0.15s; box-sizing: border-box; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) input:focus, :root:not([data-theme=light]) select:focus, :root:not([data-theme=light]) textarea:focus { box-shadow: 0 0 0 3px rgba(99,102,241,0.25); } }
input[type=number] { width: 70px; text-align: center; }
textarea { width: 100%; min-height: 80px; font-family: monospace; font-size: 13px; line-height: 1.6; }

.b { background: var(--ac); color: #fff; border-color: var(--ac); font-weight: 600; cursor: pointer; box-shadow: var(--sh); }
.b:hover { background: var(--ac-hover); border-color: var(--ac-hover); }
.w { border-color: #ef4444; color: #ef4444; font-weight: 600; cursor: pointer; }
.w:hover { background: #ef4444; color: #fff; }

.row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.row label { display: flex; flex-direction: column; font-size: 12px; font-weight: 600; color: var(--mu); gap: 6px; }
.mu { color: var(--mu); font-size: 13px; }
.warn { background: #fffbeb; color: #b45309; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #fde68a; font-size: 13px; }

   REPORT CARD LAYOUT (Ensure crisp printing)

.rc table{border-collapse:collapse;width:100%}

.lg{width:110px;height:var(--lgh);flex:none;display:flex;align-items:center;justify-content:center}

.bar{background:#1f3864;color:#fff;text-align:center;font-weight:700;padding:4px;margin-top:var(--bm);font-size:calc(var(--fs) - 1px);letter-spacing:1px}
.ac th{background:#c9a84c;color:#fff;text-align:center;font-size:11px}
.ac td{text-align:center;padding:var(--acp)}
.ac td:nth-child(2){text-align:left;padding-left:8px}

.ac td:nth-child(6){font-weight:700}
.ac .tt td{background:#e0e0e0 !important;font-weight:700;font-size:13px}
.ac th:nth-child(1){width:5%}.ac th:nth-child(2){width:35%}.ac th:nth-child(3){width:10%}.ac th:nth-child(4){width:10%}.ac th:nth-child(5){width:10%}.ac th:nth-child(6){width:10%}.ac th:nth-child(7){width:20%}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:var(--tm2);align-items:stretch}
.tri table{height:100%}
.tri th.h{background:#2f3b4c;color:#fff;text-align:center;font-size:11px;padding:3px}
.tri th{text-align:left;background:#d9e4f0;color:#1f3864;font-weight:600;padding:2px 5px}
.tri td{text-align:center;padding:2px 5px}
.dm th{background:#d9e4f0;color:#1f3864;text-align:left;font-weight:600}
.dm th.r{text-align:right}
.dm td{width:18%;background:#fff;text-align:center}
.rs{text-align:center;margin:var(--rsm) auto;width:46%}
.rs div{padding:3px;font-style:italic;background:#d0d0d0;font-size:11px}
.rs div+div{background:#c6e0b4}
.rm th{background:#d9e4f0;color:#1f3864;width:22%;font-weight:600}
.rm td{height:var(--rh);font-style:italic;padding-left:8px}
.sg{text-align:center;margin-top:var(--sgm);font-size:calc(var(--fs) - 1px)}
.ft{background:#f8e6c0;color:#555;text-align:right;font-style:italic;font-size:10px;padding:4px 8px;border-top:3px solid #c9a84c;margin-top:var(--ftm)}

@media print{
  header,nav,.np{display:none !important}
  body{background:#fff}
  main{padding:0;max-width:none;margin:0}
  /* Print: A4 with white margins like the Excel sheet. --pz scales the card (smaller = wider margins) */
  .rc{border:0;margin:0 auto;padding:20mm 0 0;width:780px;max-width:none;zoom:.82;break-inside:avoid;box-shadow:none;}
  .rc+.rc{break-before:page}
  @page{size:A4;margin:0} /* margin 0 = browser prints no date/title/URL/page-number header or footer */
}
.po{display:none}@media print{.po{display:block;text-align:center;margin:0 0 8px}}input:disabled{opacity:.6}

<script>

let C=DEF,ST=[],SC={},db,user,admin=false,view='scores',sel={c:'',r:'ALL'},u2,key,promo={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const allowedClasses=()=>{const all=C.classes.map(x=>x.n);if(admin)return all;return all.filter(n=>MYCLASSES.includes(n))};

const gr=v=>C.bands.find(b=>v>=b.m)||C.bands[C.bands.length-1],ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10<4)?n%10:0]);
const act=c=>ST.filter(s=>s.on!==false&&s.cls==c);

function calc(d,subs){const rows=subs.map(s=>{const[a,e]=(d&&d.sc&&d.sc[s])||[];const ca=+a||0,ex=+e||0,t=ca+ex,em=bl(a)&&bl(e);return{s,ca,ex,t,b:em?NB:gr(t),e:em}});const tot=rows.reduce((x,r)=>x+r.t,0),avg=subs.length?tot/subs.length:0,has=rows.some(r=>!r.e);return{rows,tot,avg,has,b:has?gr(avg):NB}}

const lkey=x=>String(x).replace(/\s+/g,'').toUpperCase(),nrmSS=k=>k.replace(/^SSS/,'SS');
function nextLevelKey(lv){const k=lkey(lv),T0={CRECHE:'NURSERY1',PRENURSERY1:'PRENURSERY2',PRENURSERY2:'NURSERY1',NURSERY1:'NURSERY2',NURSERY2:'BASIC1'};if(T0[k])return T0[k];const m=/^(BASIC|JSS|SSS|SS)(\d+)$/.exec(k);if(!m)return undefined;const n=+m[2],p=m[1];if(p=='BASIC')return n<5?'BASIC'+(n+1):'JSS1';if(p=='JSS')return n<3?'JSS'+(n+1):'SS1';return n<3?p+(n+1):'GRAD'}

/* ===== AUTO-FIT: shrink spacing (and if still needed, zoom) until each card fits one A4 page ===== */
const FITV={'--fs':[12,9],'--py':[4,1],'--acp':[6,1],'--tm':[12,3],'--tm2':[10,3],'--bm':[9,3],'--rsm':[7,2],'--rh':[26,14],'--sgm':[22,4],'--sgh':[56,28],'--lgh':[78,40],'--h2':[21,15],'--srm':[10,3],'--ftm':[15,4],'--tp':[6,2]};
function setDensity(c,t){for(const k in FITV){const[a,b]=FITV[k];c.style.setProperty(k,(a+(b-a)*t).toFixed(2)+'px')}}
function fitCards(root){
  (root||document).querySelectorAll('.rc').forEach(c=>{
    const ow=c.style.width,om=c.style.maxWidth;
    c.style.width='780px';c.style.maxWidth='none';c.style.zoom='';
    const target=Math.floor(780*297/210)-10;
    setDensity(c,0);
    void c.offsetHeight;
    if(c.offsetHeight>target){
      let lo=0,hi=1;setDensity(c,1);void c.offsetHeight;
      if(c.offsetHeight<=target){
        for(let i=0;i<9;i++){const m=(lo+hi)/2;setDensity(c,m);void c.offsetHeight;if(c.offsetHeight<=target)hi=m;else lo=m}
        setDensity(c,hi);
      }else{
        const h=c.offsetHeight;c.style.zoom=(target/h*.82).toFixed(4); /* .82 = print margin scale, keeps one page even with very many subjects */
      }
    }
    c.style.width=ow;c.style.maxWidth=om;
  })
}
window.addEventListener('beforeprint',()=>fitCards());

async function addSt(n,c,g,t,h,p,e){if(!n||!C.classes.some(x=>x.n==c))return false;if(ST.some(s=>s.cls==c&&String(s.name).trim().toLowerCase()==n.trim().toLowerCase()))return false;const ab=(c.replace(/[^A-Za-z]/g,'').slice(0,3)+c.replace(/\D/g,'')).toUpperCase();let i=ST.filter(s=>s.cls==c).length+1,r;do r=C.pfx+ab+String(i++).padStart(3,'0');while(ST.some(s=>s.reg==r));const o={reg:r,name:n,cls:c,g:g||'',type:t||'Day',house:h||'',phone:p||'',email:e||'',on:true,hist:[]};ST.push(o);try{await db.doc('students/'+r).set(o)}catch(x){ST=ST.filter(y=>y!==o);alert('Could not save student: '+(x.message||x));return false}return true}

/* keyboard navigation: Enter/Arrow keys move within score grid */
$('#m').addEventListener('keydown',e=>{
  if(!['Enter','ArrowDown','ArrowUp'].includes(e.key))return;
  const c=e.target.closest&&e.target.closest('input[data-sc]');if(!c)return;
  e.preventDefault();
  const tr=c.closest('tr'),subs=cd(curC()).s,sj=c.dataset.sc,kk=+c.dataset.k;
  const focus=(r,s,k)=>{const t=r&&r.querySelector(`input[data-sc="${s}"][data-k="${k}"]`);if(t){t.focus();t.select();return true}return false};
  if(e.key==='ArrowUp'){focus(tr.previousElementSibling,sj,String(kk));return}
  if(e.key==='ArrowDown'){focus(tr.nextElementSibling,sj,String(kk));return}
  if(kk===0){focus(tr,sj,'1');return}
  const ci=subs.indexOf(sj);
  if(ci>=0&&ci<subs.length-1){focus(tr,subs[ci+1],'0');return}
  focus(tr.nextElementSibling,sj,'1');
});

function rowUp(tr){
  const subs=cd(curC()).s,ins=[...tr.querySelectorAll('input')];
  const tot=ins.reduce((a,i)=>a+(+i.value||0),0);
  const av=subs.length?tot/subs.length:0;
  tr.querySelector('.tot').textContent=tot;
  tr.querySelector('.avg').textContent=av.toFixed(1);
  tr.querySelector('.gd').textContent=ins.some(i=>i.value!=='')?gr(av).g:'—';
  const reg=tr.dataset.r, rows=[...tr.parentNode.querySelectorAll('tr[data-r]')];
  const allTotals=rows.map(r=>{
    const i2=[...r.querySelectorAll('input')];
    return {reg:r.dataset.r, has:i2.some(i=>i.value!==''), tot:i2.reduce((a,i)=>a+(+i.value||0),0)};
  }).filter(x=>x.has);
  const my=allTotals.find(x=>x.reg===reg);
  const p=my?1+allTotals.filter(x=>x.tot>my.tot).length:0;
  tr.querySelector('.ps').textContent=p?ord(p):'—';
}

/* STRICT 1-PAGE PDF GENERATION — aspect-ratio preserved, vertically centred.

async function pdf(){
  const cs=[...document.querySelectorAll('#m .rc')],st=$('#pst');if(!cs.length)return;
  try{
    if(!window.jspdf||!window.html2canvas)throw new Error('PDF tools did not load, reload the page');
    fitCards($('#m'));
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    await new Promise(r=>setTimeout(r,80));
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const PAGE_W=210,PAGE_H=297,MARGIN=20; /* mm of white space around the card; raise for wider margins */
    const MAX_W=PAGE_W-MARGIN*2,MAX_H=PAGE_H-MARGIN*2;
    for(let i=0;i<cs.length;i++){
      st.textContent='Building page '+(i+1)+' of '+cs.length+'…';
      const cv=await html2canvas(cs[i],{scale:4,backgroundColor:'#fff'});
      const imgData=cv.toDataURL('image/png');
      if(i)doc.addPage();
      let w=MAX_W,h=cv.height*(MAX_W/cv.width);
      if(h>MAX_H){h=MAX_H;w=cv.width*(MAX_H/cv.height)}
      const x=(PAGE_W-w)/2,y=(PAGE_H-h)/2;
      doc.addImage(imgData,'PNG',x,y,w,h);
    }
    const blob=doc.output('blob');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${curC()}_${sel.r=='ALL'?'All':sel.r}_${pid()}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);st.textContent='PDF ready.'
  }catch(e){st.textContent='PDF failed: '+(e.message||e)}
}

function cum(s,k){if(!C.t)return'';let sum=k.tot,av=k.avg,n=1;const row=(a,b,c,e)=>`<tr><td>${a}</td><td>${b}</td><td>${c}</td><td>${e}</td></tr>`,R=[];for(let j=0;j<C.t;j++){const d=(PV[j]||{})[s.reg],x=d?calc(d,d.subs||Object.keys(d.sc||{})):null;R.push(row(T[j],x?x.tot:'—',x?x.avg.toFixed(1):'—',x?x.b.g:'—'));if(x){sum+=x.tot;av+=x.avg;n++}}R.push(row(T[C.t]+' (this term)',k.tot,k.avg.toFixed(1),k.b.g));if(C.t==2)R.push(row('Cumulative ('+n+' terms)',sum,(av/n).toFixed(1),gr(av/n).g));return`<div class="bar" style="margin-top:10px">TERMLY RECORD</div><table class="cm"><tr><th>Term</th><th>Total Score</th><th>Average</th><th>Grade</th></tr>${R.join('')}</table>`}
function bprint(){let st=document.getElementById('pg');if(!st){st=document.createElement('style');st.id='pg';document.head.append(st)}st.textContent='@media print{@page{size:A4 landscape;margin:0}main{padding:10mm!important}}';const off=()=>{st.textContent='';window.removeEventListener('afterprint',off)};window.addEventListener('afterprint',off);try{window.print()}catch(x){}}
function bxl(){if(!window.XLSX)return alert('The spreadsheet library did not load. Reload the page.');const c=curC(),subs=cd(c).s,pm=posMap(c),L=act(c).map(s=>({s,k:calc(SC[s.reg],subs)})).sort((a,b)=>b.k.tot-a.k.tot),rows=[['Pos.','Reg No.','Name',...subs,'Total','Average','Grade']];L.forEach(x=>rows.push([(pm[x.s.reg]||{p:0}).p||'',x.s.reg,x.s.name,...x.k.rows.map(r=>r.e?'':r.t),x.k.has?x.k.tot:'',x.k.has?+x.k.avg.toFixed(1):'',x.k.b.g]));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),c.replace(/[\\\/?*\[\]:]/g,'').slice(0,31)||'Class');const b=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='Broadsheet_'+c+'_'+pid()+'.xlsx';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),5000)}
/* ===== DANGER ZONE: delete all students / all scores, re-checks the admin password first ===== */
function dangerBox(){return`<div class="box" style="border-color:#c0392b"><b style="color:#c0392b">Danger zone</b><p class="mu">Permanently deletes data for every class and every term. School settings, logo, signatures and staff logins are kept. You will be asked to enter your password again.</p><label style="display:block;margin:4px 0"><input type="checkbox" id="dz-s"> Delete all students (names, bio-data, promotion history)</label><label style="display:block;margin:4px 0"><input type="checkbox" id="dz-c"> Delete all scores, attendance, ratings and remarks (all terms)</label><button class="w" data-act="wipe" style="margin-top:10px">Delete selected records…</button></div>`}
async function wipe(){const s=$('#dz-s').checked,c=$('#dz-c').checked;if(!s&&!c)return alert('Tick what you want to delete first.');if(!db||!admin)return;
const cnt=async col=>{const{count}=await sb.from('docs').select('*',{count:'exact',head:true}).eq('col',col);return count||0};
const ns=s?await cnt('students'):0,nc=c?await cnt('scores'):0,em=(await sb.auth.getUser()).data.user.email;
const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:99';
o.innerHTML=`<form class="box" style="width:340px"><b style="color:#c0392b">Confirm permanent deletion</b><p>This will delete:${s?`<br>• <b>${ns}</b> student record(s)`:''}${c?`<br>• <b>${nc}</b> score record(s)`:''}<br>This cannot be undone.</p><p class="mu">Signed in as ${esc(em)}. Enter your password again to continue.</p><p><input name="p" type="password" placeholder="Password" style="width:100%;box-sizing:border-box" required></p><p><input name="t" placeholder="Type DELETE to confirm" style="width:100%;box-sizing:border-box" required></p><p class="mu" id="dzm"></p><button class="w" style="width:48%">Delete forever</button> <button type="button" id="dzx" style="width:48%">Cancel</button></form>`;
document.body.append(o);o.querySelector('#dzx').onclick=()=>o.remove();
o.firstChild.onsubmit=async ev=>{ev.preventDefault();const f=ev.target,m=o.querySelector('#dzm');if(f.t.value.trim()!='DELETE'){m.textContent='Type DELETE exactly.';return}
m.textContent='Checking password…';const{error:e1}=await sb.auth.signInWithPassword({email:em,password:f.p.value});if(e1){m.textContent='Wrong password. Nothing was deleted.';return}
try{m.textContent='Deleting…';for(const[col,on]of[['scores',c],['students',s]])if(on){const{error}=await sb.from('docs').delete().eq('col',col);if(error)throw error}
if(s)ST=[];if(c){SC={};PV={}}o.remove();draw();alert('Selected records deleted.')}catch(x){m.textContent='Failed: '+(x.message||x)}}}
$('#m').addEventListener('click',e=>{if(e.target.dataset.act=='wipe'&&admin)wipe()});
$('#nv').addEventListener('click',e=>{if(e.target.dataset.v){view=e.target.dataset.v;draw()}});
(async()=>{try{draw();db=await claude.use('db');user=await claude.use('user');admin=!!(user&&user.canEdit());if(!db){draw();return}
db.doc('cfg/school').onSnapshot(s=>{C=s.exists?{...DEF,...s.data()}:DEF;sub();draw(1)});db.collection('students').onSnapshot(q=>{ST=q.docs.map(d=>d.data()).sort((a,b)=>String(a.name).localeCompare(String(b.name)));draw(1)});sub();draw()}catch(e){$('#m').innerHTML='<div class="warn">Could not start: '+esc(e.message||e)+'. Reload the page.</div>'}})();
</script>
