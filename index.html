<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Report Builder</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#faf8f5;
  --bg-elevated:#ffffff;
  --fg:#1c2422;
  --fg-muted:#5b6663;
  --fg-subtle:#8b9691;
  --ac:#5b8a72;
  --ac-hover:#4a7560;
  --ac-soft:#e8f0eb;
  --ac-ink:#2f4d3d;
  --bd:#e6e2db;
  --bd-strong:#d4cec4;
  --danger:#c25a4f;
  --danger-soft:#fbeeec;
  --warn-bg:#fdf6e3;
  --warn-fg:#8a6d2f;
  --shadow-sm:0 1px 2px rgba(28,36,34,.04),0 1px 3px rgba(28,36,34,.06);
  --shadow-md:0 2px 4px rgba(28,36,34,.05),0 4px 12px rgba(28,36,34,.08);
  --shadow-lg:0 4px 8px rgba(28,36,34,.06),0 12px 32px rgba(28,36,34,.10);
  --shadow-xl:0 8px 16px rgba(28,36,34,.08),0 24px 48px rgba(28,36,34,.12);
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:16px;
  --ease:cubic-bezier(.4,0,.2,1);
  --dur:200ms;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#151a18;
    --bg-elevated:#1e2521;
    --fg:#e8ebe9;
    --fg-muted:#a3aca8;
    --fg-subtle:#6e7873;
    --ac:#7aa98e;
    --ac-hover:#8fbe9f;
    --ac-soft:#243029;
    --ac-ink:#c4e0d0;
    --bd:#2a332e;
    --bd-strong:#3a453f;
    --danger:#e07a6e;
    --danger-soft:#2e1e1c;
    --warn-bg:#2a2518;
    --warn-fg:#e0c87a;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 2px 4px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.4);
    --shadow-lg:0 4px 8px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5);
    --shadow-xl:0 8px 16px rgba(0,0,0,.5),0 24px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme=dark]{
  --bg:#151a18;--bg-elevated:#1e2521;--fg:#e8ebe9;--fg-muted:#a3aca8;--fg-subtle:#6e7873;
  --ac:#7aa98e;--ac-hover:#8fbe9f;--ac-soft:#243029;--ac-ink:#c4e0d0;
  --bd:#2a332e;--bd-strong:#3a453f;--danger:#e07a6e;--danger-soft:#2e1e1c;
  --warn-bg:#2a2518;--warn-fg:#e0c87a;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.005em;
}

header{
  background:linear-gradient(135deg,var(--ac-ink) 0%,var(--ac) 100%);
  color:#fff;
  padding:16px 20px;
  display:flex;
  gap:14px;
  align-items:center;
  flex-wrap:wrap;
  position:relative;
  z-index:20;
  box-shadow:var(--shadow-md);
}
header::after{
  content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.12),transparent 60%);pointer-events:none;
}
header b{font-size:17px;font-weight:650;letter-spacing:-.02em;position:relative}
header span{opacity:.92;font-size:12.5px;font-weight:500;position:relative}
header a{color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);transition:background var(--dur) var(--ease);position:relative}
header a:hover{background:rgba(255,255,255,.24)}

nav{
  display:flex;gap:4px;padding:10px 16px;flex-wrap:wrap;background:var(--bg-elevated);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10;box-shadow:var(--shadow-sm);
}
nav button{
  border:0;background:none;color:var(--fg-muted);padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;font-size:13.5px;transition:all var(--dur) var(--ease);position:relative;
}
nav button:hover{background:var(--ac-soft);color:var(--ac-ink)}
nav button.on{background:var(--ac);color:#fff;box-shadow:0 2px 8px rgba(91,138,114,.3)}

main{padding:24px 20px;max-width:1240px;margin:auto;animation:fadeUp .28s cubic-bezier(.4,0,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.box{
  background:var(--bg-elevated);border:1px solid var(--bd);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm);transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease);
}
.box:hover{border-color:var(--bd-strong)}
.box>b:first-child{
  font-size:15.5px;font-weight:650;letter-spacing:-.015em;margin-bottom:16px;display:block;color:var(--fg);
}

.sc{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--bd);background:var(--bg-elevated)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bd)}
th{
  background:var(--ac-soft);color:var(--ac-ink);font-weight:650;font-size:12.5px;letter-spacing:.01em;white-space:nowrap;border-top:none;
}
td{color:var(--fg)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background 120ms var(--ease)}
tbody tr:hover td{background:var(--ac-soft)}
td.c,th.c{text-align:center}

input,select,textarea,button{
  font:inherit;color:var(--fg);background:var(--bg-elevated);border:1.5px solid var(--bd);border-radius:10px;padding:9px 12px;transition:all var(--dur) var(--ease);box-sizing:border-box;
}
input:hover,select:hover,textarea:hover{border-color:var(--bd-strong)}
input:focus,select:focus,textarea:focus,button:focus-visible{
  outline:none;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-soft);
}
input[type=number]{width:66px;text-align:center}
input[type=checkbox]{width:auto;padding:0;border-radius:4px;accent-color:var(--ac)}
textarea{width:100%;min-height:80px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:1.6}

button{cursor:pointer;font-weight:600;letter-spacing:-.005em;white-space:nowrap}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
.b{
  background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 2px 6px rgba(91,138,114,.25);
}
.b:hover{background:var(--ac-hover);border-color:var(--ac-hover);box-shadow:0 4px 12px rgba(91,138,114,.35)}
.w{border-color:var(--danger);color:var(--danger);background:var(--bg-elevated)}
.w:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.row label{display:flex;flex-direction:column;font-size:12px;font-weight:600;color:var(--fg-muted);gap:6px;letter-spacing:.01em}
.mu{color:var(--fg-muted);font-size:13px;line-height:1.55}
.warn{background:var(--warn-bg);color:var(--warn-fg);padding:14px 16px;border-radius:var(--radius);margin-bottom:14px;border:1px solid rgba(138,109,47,.15);font-size:13.5px;font-weight:500}
.tag{
  background:var(--ac);color:#fff;font-size:10.5px;padding:3px 9px;border-radius:999px;margin-left:8px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;vertical-align:middle;
}

/* ============================================================
   GLOBAL LOADING / SIGN-IN / SIGN-OUT OVERLAY
   ============================================================ */
#ov {
  position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(20,26,24,.55);backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);opacity:0;transition:opacity 220ms var(--ease);font-family:inherit;
}
#ov.show { display:flex; opacity:1; }
#ov .ov-card {
  background:var(--bg-elevated);border-radius:24px;padding:36px 40px 32px;min-width:320px;max-width:420px;box-shadow:var(--shadow-xl);display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(12px) scale(.97);animation:ovIn 320ms cubic-bezier(.34,1.56,.64,1) forwards;border:1px solid var(--bd);
}
@keyframes ovIn{to{transform:translateY(0) scale(1)}}
#ov .ov-orb {
  position:relative;width:72px;height:72px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;
}
#ov .ov-orb::before,
#ov .ov-orb::after {
  content:'';position:absolute;inset:0;border-radius:50%;border:3px solid transparent;
}
#ov .ov-orb::before {
  border-top-color:var(--ac);border-right-color:var(--ac);animation:ovSpin 1s linear infinite;
}
#ov .ov-orb::after {
  inset:8px;border-bottom-color:var(--ac-soft);border-left-color:var(--ac-soft);animation:ovSpin 1.6s linear infinite reverse;
}
#ov .ov-icon {
  position:relative;z-index:1;width:26px;height:26px;color:var(--ac-ink);
}
@keyframes ovSpin{to{transform:rotate(360deg)}}
#ov .ov-title {
  font-size:17px;font-weight:650;color:var(--fg);letter-spacing:-.015em;margin:0 0 6px;
}
#ov .ov-sub {
  font-size:13.5px;color:var(--fg-muted);margin:0;max-width:280px;line-height:1.5;
}
#ov .ov-bar {
  width:100%;height:4px;background:var(--ac-soft);border-radius:99px;margin-top:22px;overflow:hidden;position:relative;
}
#ov .ov-bar::after {
  content:'';position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--ac),transparent);animation:ovShimmer 1.4s ease-in-out infinite;
}
@keyframes ovShimmer{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#ov.error .ov-orb::before { border-top-color:var(--danger); border-right-color:var(--danger); animation:none; border-color:var(--danger); }
#ov.error .ov-orb::after { display:none; }
#ov.error .ov-bar { display:none; }
#ov.error .ov-icon { color:var(--danger); }

/* ============================================================
   SIGN-IN MODAL (uses the same overlay layer, styled separately)
   ============================================================ */
#signin {
  position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at top, var(--bg-elevated), var(--bg));font-family:inherit;
}
#signin.show { display:flex; }
#signin .signin-card {
  width:400px;max-width:calc(100vw - 32px);background:var(--bg-elevated);border-radius:24px;padding:40px 36px 32px;box-shadow:var(--shadow-xl);border:1px solid var(--bd);animation:ovIn 400ms cubic-bezier(.34,1.56,.64,1);
}
#signin .signin-brand {
  display:flex;align-items:center;gap:12px;margin-bottom:24px;
}
#signin .signin-mark {
  width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--ac-ink),var(--ac));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;box-shadow:0 4px 12px rgba(91,138,114,.35);
}
#signin .signin-brand-text b { display:block; font-size:17px; font-weight:650; color:var(--fg); letter-spacing:-.02em; }
#signin .signin-brand-text span { display:block; font-size:12.5px; color:var(--fg-muted); margin-top:2px; }
#signin h2 { margin:0 0 6px; font-size:22px; font-weight:680; color:var(--fg); letter-spacing:-.025em; }
#signin .signin-sub { margin:0 0 24px; font-size:13.5px; color:var(--fg-muted); line-height:1.55; }
#signin .field { margin-bottom:16px; }
#signin .field label {
  display:block;font-size:12.5px;font-weight:600;color:var(--fg-muted);margin-bottom:6px;letter-spacing:.005em;
}
#signin .field input {
  width:100%;padding:13px 14px;font-size:14.5px;border-radius:12px;
}
#signin .signin-error {
  background:var(--danger-soft);color:var(--danger);font-size:13px;padding:11px 14px;border-radius:10px;margin-bottom:16px;font-weight:500;display:none;animation:shake .4s ease;
}
#signin .signin-error.show { display:block; }
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%,60%{transform:translateX(-6px)}
  40%,80%{transform:translateX(6px)}
}
#signin .signin-submit {
  width:100%;padding:13px;font-size:15px;font-weight:650;border-radius:12px;margin-top:8px;position:relative;
}
#signin .signin-submit .spinner {
  display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:ovSpin .7s linear infinite;margin-right:8px;vertical-align:middle;
}
#signin .signin-submit.loading .spinner { display:inline-block; }
#signin .signin-submit.loading { pointer-events:none; opacity:.85; }
#signin .signin-footer {
  margin-top:22px;font-size:11.5px;color:var(--fg-subtle);text-align:center;line-height:1.55;
}

/* ============================================================
   TOAST
   ============================================================ */
#toast {
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg-elevated);padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-xl);opacity:0;pointer-events:none;transition:all 260ms cubic-bezier(.34,1.56,.64,1);z-index:10000;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);
}
#toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
#toast.ok { background:#2f7d5b; color:#fff; }
#toast.err { background:var(--danger); color:#fff; }
#toast .ti { width:16px; height:16px; flex:none; }

/* ============================================================
   REPORT CARD (unchanged)
   ============================================================ */
.rc{
  box-sizing:border-box;background:#fff;color:#111;border:1px solid #bbb;padding:0 8px 0;margin:0 auto 14px;max-width:780px;font-size:var(--fs,12px);-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:4px;box-shadow:var(--shadow-lg);
}
.rc table{border-collapse:collapse;width:100%}
.rc td,.rc th{border:1px solid #cfd6df;padding:var(--pv,3px) var(--ph,6px);color:#111;background:none;font-size:var(--fs,12px)}
.rc .top{display:flex;align-items:center;border-top:3px solid #538135;border-bottom:3px solid #538135;padding:var(--tp,6px) 0}
.lg{width:var(--lw,110px);height:var(--lh,80px);flex:none;display:flex;align-items:center;justify-content:center}.lg img{max-width:100%;max-height:100%}
.hd{flex:1;text-align:center}.hd h2{margin:0;color:#1f3864;font-size:var(--h2,21px)}.hd .ad{color:#2f6db5}.hd .srs{font-weight:700;color:#1f3864;margin-top:var(--sm,10px)}
.inf{display:flex;gap:16px;margin-top:2px}.inf table{flex:1;min-width:0}.inf th{background:#d9e4f0;color:#1f3864;text-align:left;width:40%}.inf td{text-align:center;background:#fff}.inf .rt th{text-align:right}.inf .rt td{text-align:left}
.bar{background:#1f3864;color:#fff;text-align:center;font-weight:700;padding:var(--bp,3px);margin-top:var(--bm,8px)}
.ac th{background:#c9a84c;color:#fff;text-align:center}.ac td{text-align:center;padding:var(--rp,7px) var(--ph,6px)}.ac td:nth-child(2){text-align:left}.ac tr:nth-child(even) td{background:#f2f2f2}.ac td:nth-child(6){font-weight:700;font-style:italic}.ac .tt td{background:#d0d0d0!important;font-weight:700;font-size:var(--fs2,14px)}
.tri{display:flex;gap:12px;align-items:flex-start;margin-top:var(--tm,14px)}.tri table{flex:1;min-width:0}
.rc th.h{background:#2f3b4c;color:#fff;text-align:center}.tri td{text-align:center}
.dm th{background:#d9e4f0;color:#1f3864;text-align:left;font-weight:400}.dm th.r{text-align:right}.dm td{width:18%;background:#fff;text-align:center}
.rs{text-align:center;margin:var(--rsm,6px) auto;width:46%}.rs div{padding:3px;font-style:italic;background:#d0d0d0}.rs div+div{background:#c6e0b4}
.rm th{background:#d9e4f0;color:#1f3864;width:22%}.rm td{height:var(--rh,24px)}
.sg{text-align:center;margin-top:var(--sg,30px)}.ft{background:#f8e6c0;color:#555;text-align:right;font-style:italic;font-size:10px;padding:4px 8px;border-top:3px solid #c9a84c;margin:var(--fm,16px) -8px 0}
.cm th{background:#c9a84c;color:#fff;text-align:center}.cm td{text-align:center}.cm tr:last-child td{font-weight:700;background:#d0d0d0}
.bar.m2{margin-top:var(--bm2,14px)}
.sg img{height:var(--si,56px)!important}

@media print{
  header,nav,.np,#ov,#signin,#toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none;margin:0;animation:none}
  .rc{border:0;margin:0 auto;padding-top:12mm;width:780px;max-width:none;break-inside:avoid;zoom:calc(var(--pz,1)*.85);box-shadow:none;border-radius:0}
  .rc+.rc{break-before:page}
  @page{size:A4;margin:0}
}
.po{display:none}@media print{.po{display:block;text-align:center;margin:0 0 8px}}
input:disabled{opacity:.55;cursor:not-allowed}
input.bad{border-color:var(--danger)!important;background:var(--danger-soft)!important;color:var(--danger)}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  button:hover{transform:none}
}

@media (max-width:640px){
  main{padding:16px 12px}
  .box{padding:18px;border-radius:14px}
  nav{padding:8px 10px}
  nav button{padding:8px 12px;font-size:13px}
  header{padding:14px 16px}
  .row{gap:10px}
  .row label{flex:1;min-width:140px}
  th,td{padding:8px 10px;font-size:13px}
  #ov .ov-card{padding:28px 24px 24px;min-width:auto;width:calc(100vw - 32px)}
  #signin .signin-card{padding:32px 24px 24px}
}

/* ---- admin control centre ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 14px}
.kpi{background:var(--bg-elevated);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.kpi .kl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-muted)}
.kpi .kv{font-size:26px;font-weight:700;margin:4px 0 2px;line-height:1.15;overflow-wrap:anywhere}
.kpi .ks{font-size:12px;color:var(--fg-muted)}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
.cg .box{margin:0}
details>summary{cursor:pointer}
@media print{#lockbar{display:none!important}}
</style>
</head>
<body>
<header><b id="sn">Smart Report Builder</b><span id="ps"></span><span id="rl"></span><span id="sstat" style="margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;transition:all .2s ease"></span></header>
<nav class="np" id="nv"></nav>
<main id="m"></main>

<!-- ============ GLOBAL LOADING OVERLAY ============ -->
<div id="ov" aria-live="polite" aria-busy="true">
  <div class="ov-card">
    <div class="ov-orb" aria-hidden="true">
      <svg class="ov-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
    </div>
    <p class="ov-title" id="ovTitle">Working…</p>
    <p class="ov-sub" id="ovSub">Please wait a moment.</p>
    <div class="ov-bar"></div>
  </div>
</div>

<!-- ============ SIGN-IN MODAL ============ -->
<div id="signin" role="dialog" aria-modal="true" aria-labelledby="signinTitle">
  <form class="signin-card" id="signinForm" novalidate>
    <div class="signin-brand">
      <div class="signin-mark">SR</div>
      <div class="signin-brand-text">
        <b>Smart Report Builder</b>
        <span>Staff sign-in</span>
      </div>
    </div>
    <h2 id="signinTitle">Welcome back</h2>
    <p class="signin-sub" id="signinMsg">Sign in with your staff account to continue.</p>
    <div class="signin-error" id="signinErr"></div>
    <div class="field">
      <label for="siEmail">Email</label>
      <input id="siEmail" name="email" type="email" required autocomplete="username" placeholder="you@school.edu">
    </div>
    <div class="field">

let _ovCount = 0;
function overlay(title, sub) {

function overlayHide() {

const nzv=v=>(v===undefined||v===null||v==='')?'':v;
const cutv=v=>v===undefined||v===null?'':(typeof v=='string'&&v.length>80?v.slice(0,77)+'…':v);
function flat(o,p,out,d){out=out||{};d=d||0;
  if(o&&typeof o=='object'&&!Array.isArray(o)&&d<4){Object.keys(o).forEach(k=>flat(o[k],p?p+'.'+k:k,out,d+1))}
  else if(Array.isArray(o)&&p&&p.indexOf('sc.')==0){o.forEach((v,i)=>out[p+'.'+i]=v)}
  else if(p)out[p]=Array.isArray(o)?JSON.stringify(o):o;
  return out}
const SKIPK=['subs','p','reg','logo','sig','psig'];
function diffDocs(a,b){const fa=flat(a||{},'',{}),fb=flat(b||{},'',{}),out=[];
  new Set([...Object.keys(fa),...Object.keys(fb)]).forEach(k=>{if(SKIPK.includes(k.split('.')[0]))return;if(JSON.stringify(nzv(fa[k]))===JSON.stringify(nzv(fb[k])))return;out.push({k,f:cutv(fa[k]),t:cutv(fb[k])})});
  return out.slice(0,40)}
function hk(k){let m;
  if(m=/^sc\.(.+)\.([01])$/.exec(k))return m[1]+(m[2]=='0'?' CA':' Exam');
  if(m=/^sc\.(.+)$/.exec(k))return m[1]+' scores';
  if(m=/^dom\.(.+)$/.exec(k))return m[1]+' rating';
  return({pres:'Days present',g:'Gender',cls:'Class',on:'Active',type:'Class type',name:'Name',house:'House',phone:'Parent phone',email:'Parent email',ses:'Session',t:'Term',promoPass:'Promotion pass mark'})[k]||k}

  if(col=='students')return (o.name||stName(id))+(o.cls?' ('+o.cls+')':'');

  const det=ch.slice(0,4).map(c=>hk(c.k)+': '+shw(c.f)+' → '+shw(c.t)).join('; ')+(ch.length>4?' (+'+(ch.length-4)+' more)':'');
  audLog(action,targetOf(col,id,nu),det,ch)

function buildSQL(cond,note){return [
'-- ===== Smart Report Builder: admin control centre =====',
'-- Run once in Supabase > SQL Editor. Safe to re-run.',
note||'',
'-- 1) Is the signed-in user an active administrator?',
'create or replace function public.is_admin() returns boolean',
'language sql stable security definer set search_path = public as $$',
"  select exists (select 1 from public.staff where "+cond+" and role = 'admin' and coalesce(status,'active') = 'active')",
'$$;','',
'-- 2) Activity log (everyone can write their own entries, only admins can read)',

function expPDF(){if(!admin)return;if(!window.jspdf)return toast('PDF tools did not load, reload the page','err');
  const L=expList(),cols=EXC.filter(([k])=>exf.cols[k]);if(!L.length)return toast('No students match this selection.','err');if(!cols.length)return toast('Tick at least one column.','err');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:cols.length>6?'landscape':'portrait'}),PW=doc.internal.pageSize.getWidth(),PH=doc.internal.pageSize.getHeight(),M=12,UW=PW-2*M;
  const WT={reg:1.7,name:2.8,g:.9,cls:1.5,type:1.1,house:1.1,phone:1.7,email:2.8,st:1.1},tw=cols.reduce((a,[k])=>a+WT[k],0),W=cols.map(([k])=>WT[k]/tw*UW);
  const title='Student list — '+(exf.c=='ALL'?'All classes':exf.c)+(exf.t!='ALL'?' · '+exf.t:'')+' · '+({active:'Active',withdrawn:'Withdrawn / past',all:'All students'}[exf.s]);
  const fit=(t,w)=>{t=String(t);if(doc.getTextWidth(t)<=w-2)return t;while(t.length>1&&doc.getTextWidth(t+'…')>w-2)t=t.slice(0,-1);return t+'…'};
  let y=0;
  const head=()=>{doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(30);doc.text(String(C.name||'School'),M,M+4);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);doc.text(title,M,M+10);doc.text('Generated '+new Date().toLocaleString()+' · '+sesL(C.ses)+' '+T[C.t]+' · '+L.length+' student(s)',M,M+15);y=M+20};
  const colhead=()=>{doc.setFillColor(228,236,231);doc.rect(M,y,UW,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(30);let x=M;cols.forEach(([k,l],i)=>{doc.text(l,x+1,y+4.8);x+=W[i]});y+=7;doc.setFont('helvetica','normal')};
  const room=h=>{if(y+h>PH-16){doc.addPage();head();colhead()}};
  head();colhead();
  const groups=exf.c=='ALL'&&exf.g?[...new Set(L.map(s=>s.cls))].map(n=>[n,L.filter(s=>s.cls==n)]):[[null,L]];
  groups.forEach(([n,list])=>{
    if(n){room(18);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(40,90,70);doc.text(n+'  ('+list.length+')',M,y+5);y+=7.5}
    list.forEach((s,i)=>{room(7);if(i%2==0){doc.setFillColor(246,249,247);doc.rect(M,y,UW,6.4,'F')}doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(40);let x=M;cols.forEach(([k],ci)=>{doc.text(fit(expVal(s,k),W[ci]),x+1,y+4.4);x+=W[ci]});y+=6.4});
    y+=3});
  const N=doc.getNumberOfPages();for(let i=1;i<=N;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text('Confidential — administrator use only',M,PH-7);doc.text('Page '+i+' of '+N,PW-M,PH-7,{align:'right'})}
  doc.save(expName()+'.pdf');audLog('Exported student list (PDF)','',expDesc());toast('PDF downloaded','ok')}

/* ---------- event wiring ---------- */
const ACTLBL={print:'Printed report cards',pdf:'Downloaded report cards (PDF)',csv:'Exported scores (CSV)',bxl:'Exported broadsheet (XLSX)',bprint:'Printed broadsheet',xl:'Exported all data (XLSX)',bak:'Downloaded backup',promo:'Ran promotion',rst:'Restored a backup'};
const CC={
 'cc-lock':()=>setLock(true),'cc-unlock':()=>setLock(false),
 'cc-recheck':()=>{_ctl=1;ctlInit()},
 'cc-copysql':()=>{const t=window._sql||'';const ok=()=>toast('SQL copied. Paste it in the Supabase SQL Editor.','ok');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{const r=document.createRange();r.selectNodeContents($('#sqlbox'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Press Ctrl+C to copy the selected SQL.','ok')});else{const r=document.createRange();r.selectNodeContents($('#sqlbox'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Press Ctrl+C to copy the selected SQL.','ok')}},
 'cc-actref':()=>loadAct(),'cc-actmore':()=>loadAct(true),
 'cc-actxl':()=>{if(!window.XLSX)return toast('The spreadsheet library did not load.','err');const L=actFiltered();if(!L.length)return toast('Nothing to export.','err');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Time','User','Role','Action','Target','Details','Changes (field: before → after)'],...L.map(r=>[fmtT(r.at),r.email||'',r.role||'',r.action,r.target||'',r.detail||'',(Array.isArray(r.changes)?r.changes:[]).map(c=>hk(c.k)+': '+shw(c.f)+' → '+shw(c.t)).join(' | ')])]),'Activity');XLSX.writeFile(wb,'Activity_log_'+new Date().toISOString().slice(0,10)+'.xlsx');audLog('Exported activity log (XLSX)','',L.length+' entries')},
 'cc-dshxl':()=>{if(!window.XLSX||!DSHX)return toast('The spreadsheet library did not load.','err');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Measure','Value'],...DSHX.k]),'Overview');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(DSHX.c),'Class summary');XLSX.writeFile(wb,'Dashboard_'+new Date().toISOString().slice(0,10)+'.xlsx');audLog('Exported dashboard (XLSX)','',DSHX.k[0][1])},
 'cc-expxl':expXLSX,'cc-exppdf':expPDF};
document.addEventListener('click',e=>{const el=e.target.closest?e.target.closest('[data-act]'):null,a=el&&el.dataset.act;if(!a||el.disabled)return;
  if(ACTLBL[a]){const ctx=(a=='print'||a=='pdf')?curC()+(sel.ty!='ALL'?' · '+sel.ty:'')+' · '+(sel.r=='ALL'?'all students':stName(sel.r)):curC();audLog(ACTLBL[a],'',ctx)}
  if(CC[a]&&admin)CC[a]()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};
  if(d.dsh&&admin){dsh[d.dsh]=t.value;draw()}
  if(d.exf&&admin){exf[d.exf]=d.exf=='g'?t.checked:t.value;draw()}
  if(d.excol&&admin){exf.cols[d.excol]=t.checked?1:0;draw()}
  if(d.actf&&admin&&d.actf!='q'){ACTF[d.actf]=t.value;if(d.actf=='p')loadAct();else{draw()}}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.actf=='q'&&admin){ACTF.q=t.value;actUI()}});
let _lv='';$('#nv').addEventListener('click',e=>{const v=e.target.dataset&&e.target.dataset.v;if(v&&v!=_lv){_lv=v;audLog('Opened '+(VL[v]||v),'','')}});
function postDraw(){
  lockUI();
  if(admin){const el=$('#rl');if(el&&!el.querySelector('.js-onl-n'))el.innerHTML=esc(el.textContent)+' · <span class="js-onl-n">'+onlList().length+'</span> online'}
  const sg=view+'|'+(['scores','reports','board','info','students'].includes(view)?curC():'');if(sg!=_psig){_psig=sg;presDirty()}
  if(admin&&view=='admin'&&asub=='activity'){actUI();onlUI()}
  if(admin&&view=='admin'&&asub=='control'){if(!_ctl){_ctl=1;ctlInit()}else{const s=$('#ctlstat');if(s)s.innerHTML=_ctlHTML;const b=$('#sqlbox');if(b&&window._sql)b.textContent=window._sql}}else _ctl=0;
  if(admin&&view=='dash')onlUI()}
function ctrlBoot(){try{lockBoot()}catch(e){}presBoot();audLog('Session started','','Role: '+(ROLE=='admin'?'Administrator':'Teacher')+(MYCLASSES.length?' · Classes: '+MYCLASSES.join(', '):''));if(admin){actBoot();loadStaff()}}

(async()=>{try{draw();db=await claude.use('db');user=await claude.use('user');admin=!!(user&&user.canEdit());if(!db){draw();return}
ctrlBoot();
db.doc('cfg/school').onSnapshot(s=>{C=s.exists?{...DEF,...s.data()}:DEF;sub();draw(1)});db.collection('students').onSnapshot(q=>{ST=q.docs.map(d=>d.data()).sort((a,b)=>String(a.name).localeCompare(String(b.name)));draw(1)});sub();draw()}catch(e){$('#m').innerHTML='<div class="warn">Could not start: '+esc(e.message||e)+'. Reload the page.</div>'}})();
</script>
